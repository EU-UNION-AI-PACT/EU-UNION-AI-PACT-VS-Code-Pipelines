apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-proxy
  labels:
    app: web-proxy
    component: eu-ai-pact
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web-proxy
  template:
    metadata:
      labels:
        app: web-proxy
        component: eu-ai-pact
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
            - name: nginx-default-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
            - name: static-content
              mountPath: /usr/share/nginx/html
          readinessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 20m
              memory: 48Mi
            limits:
              cpu: 100m
              memory: 96Mi
      volumes:
        - name: nginx-config
          configMap:
            name: nginx-config
        - name: nginx-default-config
          configMap:
            name: nginx-default-config
        - name: static-content
          configMap:
            name: static-content
---
apiVersion: v1
kind: Service
metadata:
  name: web-proxy
  labels:
    app: web-proxy
    component: eu-ai-pact
spec:
  selector:
    app: web-proxy
  ports:
    - port: 80
      targetPort: 80
      name: http
