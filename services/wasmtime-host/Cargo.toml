[package]
name = "wasmtime-host"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[dependencies]
anyhow = "1"
axum = "0.7"
tokio = { version = "1", features=["rt-multi-thread","macros"] }
serde = { version = "1", features=["derive"] }
serde_json = "1"
wasmtime = "23"
parking_lot = "0.12"
chrono = { version = "0.4", features = ["serde"] }
