# EU AI Pact Reverse Proxy Configuration
server {
  listen 80;
  server_name _;

  # Static content (EU AI Pact documentation, tools)
  root /usr/share/nginx/html;
  index index.html;

  # Main frontend
  location / {
    try_files $uri /index.html;
  }

  # MCP Server routing
  location /mcp/ {
    proxy_pass         http://mcp:7000/mcp/;
    proxy_http_version 1.1;
    proxy_set_header   Host $host;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
  }

  # Wasmtime validation service
  location /validate/ {
    proxy_pass         http://wasmhost:8080/;
    proxy_http_version 1.1;
    proxy_set_header   Host $host;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
  }

  # Health checks
  location /healthz {
    access_log off;
    return 200 "healthy\n";
    add_header Content-Type text/plain;
  }
}
