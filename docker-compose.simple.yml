version: "3.9"

services:
  vault:
    image: hashicorp/vault:1.17
    container_name: vault
    cap_add:
      - IPC_LOCK
    environment:
      - VAULT_DEV_ROOT_TOKEN_ID=root-dev-token
      - VAULT_DEV_LISTEN_ADDRESS=0.0.0.0:8200
    ports:
      - "8200:8200"
    command: "server -dev"
    networks: [ app_net ]
    healthcheck:
      test: ["CMD","curl","-sf","http://localhost:8200/v1/sys/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  postgres:
    image: postgres:16
    environment:
      - POSTGRES_PASSWORD=SecurePass2024!
      - POSTGRES_USER=nlp
      - POSTGRES_DB=nlpdb
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks: [ app_net ]
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U nlp"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks: [ app_net ]
    command: redis-server --appendonly yes

networks:
  app_net:
    driver: bridge

volumes:
  pg_data:
